# Paper setting for GSM-Symbolic (Table "overall-per-dataset"):
#   weak  = gpt-3.5-turbo,     alpha=0.6, delta=0.6  (calibrated lambda ~ 0.45)
#   strong = gemini-2.0-flash, alpha=0.2, delta=0.8  (calibrated lambda ~ 0.47)
#   k = 2 retrieved strategies, no similarity cutoff
#
#   inter-cascade prepare --dataset gsm_symbolic --output-dir data/gsm_symbolic
#   inter-cascade calibrate --config configs/paper/gsm_symbolic.yaml
#   inter-cascade run --config configs/paper/gsm_symbolic.yaml \
#       --input data/gsm_symbolic/test_gsm_symbolic.json \
#       --output results/gsm_symbolic_inter_cascade.json

weak:
  provider: openai
  model: gpt-3.5-turbo
  api_key_env: OPENAI_API_KEY

strong:
  provider: gemini
  model: gemini-2.0-flash
  api_key_env: GEMINI_API_KEY
  # project_id: your-gcp-project   # the paper used Vertex AI

weak_deferral:
  alpha: 0.6
  delta: 0.6

strong_deferral:
  alpha: 0.2
  delta: 0.8

repository:
  dir: strategy_repo/gsm_symbolic
  top_k: 2
  retrieval: similarity
  include_strategy: true
  write: true
  seed_from_calibration: true

task:
  answer_type: numeric
  judge: strong

calibration_file: data/gsm_symbolic/calibration_gsm_symbolic.json
artifacts_dir: artifacts/gsm_symbolic
