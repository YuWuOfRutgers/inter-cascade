# Paper setting for MedMCQA (appendix table (d)):
#   weak  = gpt-3.5-turbo,     alpha=0.3, delta=0.8  (calibrated lambda ~ 0.69)
#   strong = gemini-2.0-flash, no threshold (always accept)
#   k = 2 retrieved strategies, no similarity cutoff
#
#   inter-cascade prepare --dataset medmcqa --output-dir data/medmcqa
#   inter-cascade calibrate --config configs/paper/medmcqa.yaml
#   inter-cascade run --config configs/paper/medmcqa.yaml \
#       --input data/medmcqa/test_medmcqa.json \
#       --output results/medmcqa_inter_cascade.json

weak:
  provider: openai
  model: gpt-3.5-turbo
  api_key_env: OPENAI_API_KEY

strong:
  provider: gemini
  model: gemini-2.0-flash
  api_key_env: GEMINI_API_KEY
  # project_id: your-gcp-project   # the paper used Vertex AI

weak_deferral:
  alpha: 0.3
  delta: 0.8

strong_deferral:
  alpha: null
  delta: null

repository:
  dir: strategy_repo/medmcqa
  top_k: 2
  retrieval: similarity
  include_strategy: true
  write: true
  seed_from_calibration: true

task:
  answer_type: multiple_choice
  judge: strong

calibration_file: data/medmcqa/calibration_medmcqa.json
artifacts_dir: artifacts/medmcqa
