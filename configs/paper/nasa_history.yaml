# Paper setting for NASA-History (main results table (d)):
#   weak  = gpt-3.5-turbo,     alpha=0.2, delta=0.7  (calibrated lambda ~ 0.87)
#   strong = gemini-2.0-flash, no threshold (always accept)
#   k = 2 retrieved strategies, no similarity cutoff
# No-explicit-variant benchmark: the paper's robustness setting.
#
#   inter-cascade prepare --dataset nasa_history --output-dir data/nasa_history
#   inter-cascade calibrate --config configs/paper/nasa_history.yaml
#   inter-cascade run --config configs/paper/nasa_history.yaml \
#       --input data/nasa_history/test_nasa_history.json \
#       --output results/nasa_history_inter_cascade.json

weak:
  provider: openai
  model: gpt-3.5-turbo
  api_key_env: OPENAI_API_KEY

strong:
  provider: gemini
  model: gemini-2.0-flash
  api_key_env: GEMINI_API_KEY
  # project_id: your-gcp-project   # the paper used Vertex AI

weak_deferral:
  alpha: 0.2
  delta: 0.7

strong_deferral:
  alpha: null
  delta: null

repository:
  dir: strategy_repo/nasa_history
  top_k: 2
  retrieval: similarity
  include_strategy: true
  write: true
  seed_from_calibration: true

task:
  answer_type: multiple_choice
  judge: strong

calibration_file: data/nasa_history/calibration_nasa_history.json
artifacts_dir: artifacts/nasa_history
