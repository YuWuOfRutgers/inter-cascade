# Paper setting for BarExamQA (appendix table (c)):
#   weak  = gpt-3.5-turbo,     alpha=0.5, delta=0.5  (calibrated lambda ~ 0.51)
#   strong = gemini-2.0-flash, no threshold (always accept)
#   k = 2 retrieved strategies, no similarity cutoff
#
#   inter-cascade prepare --dataset barexam --output-dir data/barexam
#   inter-cascade calibrate --config configs/paper/barexam.yaml
#   inter-cascade run --config configs/paper/barexam.yaml \
#       --input data/barexam/test_barexam.json \
#       --output results/barexam_inter_cascade.json

weak:
  provider: openai
  model: gpt-3.5-turbo
  api_key_env: OPENAI_API_KEY

strong:
  provider: gemini
  model: gemini-2.0-flash
  api_key_env: GEMINI_API_KEY
  # project_id: your-gcp-project   # the paper used Vertex AI

weak_deferral:
  alpha: 0.5
  delta: 0.5

strong_deferral:
  alpha: null
  delta: null

repository:
  dir: strategy_repo/barexam
  top_k: 2
  retrieval: similarity
  include_strategy: true
  write: true
  seed_from_calibration: true

task:
  answer_type: multiple_choice
  judge: strong

calibration_file: data/barexam/calibration_barexam.json
artifacts_dir: artifacts/barexam
